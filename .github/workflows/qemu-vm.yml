name: QEMU TCG bundle

# Builds a self-contained software-emulated machine that runs on the phone:
#
#   dist/qemu/courbet-qemu.tar.gz
#     bin/qemu-system-aarch64   statically linked, TCG only, no /dev/kvm
#     bin/qemu-img              so a guest disk can be made on the device
#     bin/busybox               for the guest initramfs
#     guest/vmlinuz             a real arm64 kernel, Alpine -virt
#     guest/initrd-smoke.cpio.gz  boots entirely from RAM, runs a timed benchmark
#     run.sh                    what to type on the phone
#
# Why this exists. Windows has to be read from somewhere before it can install,
# and the firmware cannot read the phone: it ships one filesystem driver, Fat,
# while every volume here is ext4 or f2fs. Making a FAT volume means editing the
# GPT, and a wrong GPT on this device means EDL 9008 with an unlock the vendor
# gates behind an authorized account. So the installer is instead made reachable
# as a file on userdata, and something that can boot it without the firmware has
# to exist. QEMU is that something.
#
# Why TCG and not KVM. CONFIG_VIRTUALIZATION is not set in the stock, the hmos
# and the COS13 kernel, and /dev/kvm is absent, so hardware-assisted guests are
# not available to a binary that touches no flash. Whether the SoC can be handed
# to EL2 at all is the separate question task A2 asks.
#
# Why everything is built from source and linked static. Android has no glibc,
# and Termux's own QEMU is a bionic build whose shared libraries are referenced
# by absolute paths inside its private prefix, which means unpacking an app
# directory on a rooted recovery. A static binary depends only on the kernel's
# system call interface, so it runs wherever the kernel runs - and nothing else
# has to be installed on the phone.

on:
  push:
    branches: [main]
    paths:
      - 'linux-prep/qemu-run.sh'
      - 'linux-prep/guest-init'
      - 'tools/mk_initramfs.py'
      - 'tools/zboot_unpack.py'
      - '.github/workflows/qemu-vm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: static qemu-system-aarch64
    # 22.04 rather than 24.04 for the same reason as the firmware workflow: the
    # toolchain pins below are the ones this image is known to carry.
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      # Job level: each run: block is a separate shell, so anything exported in
      # one step is simply not present in the next. Everything that has to
      # survive between steps lives here or in $GITHUB_ENV.
      ZLIB_VER: 1.3.1
      LIBFFI_VER: 3.4.6
      PCRE2_VER: 10.42
      PIXMAN_VER: 0.43.4
      GLIB_VER: 2.74.7
      QEMU_VER: 8.2.2
      BUSYBOX_VER: 1.36.1
      ALPINE: v3.20
      CROSS: aarch64-linux-gnu-

    steps:
      - uses: actions/checkout@v4

      - name: Install the cross toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            pkg-config \
            python3-pip python3-setuptools python3-wheel \
            autoconf libtool gettext texinfo \
            curl ca-certificates xz-utils bzip2 cpio unzip \
            flex bison perl ninja-build \
            qemu-user-static

          # A cross build asks for <triplet>-pkg-config, and QEMU names
          # aarch64-linux-gnu-pkg-config because it was given --cross-prefix.
          # 22.04 has no package by that name - the run before this one tried to
          # apt-get it and got "Unable to locate package" - and the wrapper is
          # two lines anyway: everything it would need to derive from the
          # triplet is already set explicitly in PKG_CONFIG_LIBDIR below.
          if ! command -v aarch64-linux-gnu-pkg-config >/dev/null 2>&1; then
              printf '#!/bin/sh\nexec /usr/bin/pkg-config "$@"\n' |
                sudo tee /usr/bin/aarch64-linux-gnu-pkg-config >/dev/null
              sudo chmod 0755 /usr/bin/aarch64-linux-gnu-pkg-config
          fi
          echo "cross pkg-config: $(aarch64-linux-gnu-pkg-config --version)"
          python3 -m pip install --user "meson==1.5.1"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          aarch64-linux-gnu-gcc --version | head -1
          meson --version 2>/dev/null || true

      - name: Set the cross environment
        run: |
          set -euo pipefail
          # Under RUNNER_TEMP on purpose: it is writable without sudo and lives
          # as long as the job, so the staged libraries never reach the checkout.
          echo "STAGE=$RUNNER_TEMP/stage" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/stage"
          {
            echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/stage/lib/pkgconfig:/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/stage/lib/pkgconfig"
            # Static .pc files keep their real requirements in Libs.private, and
            # without this pkg-config omits them, which shows up as undefined
            # references to pcre2 and ffi when QEMU links.
            echo "PKG_CONFIG_ALL_STATIC=1"
          } >> "$GITHUB_ENV"

      - name: Write the meson cross file
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aarch64.txt" <<EOF
          [binaries]
          c = '${CROSS}gcc'
          cpp = '${CROSS}g++'
          ar = '${CROSS}ar'
          strip = '${CROSS}strip'
          nm = '${CROSS}nm'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          # The runner cannot execute what it is building, so meson must never
          # try to probe a compiler feature by running the result.
          needs_exe_wrapper = true
          EOF
          cat "$RUNNER_TEMP/aarch64.txt"

      - name: Build zlib
        run: |
          set -euo pipefail
          # Same tarball as zlib.net, which is where this came from until a run
          # got an HTML page back from it and tar died with "not in gzip format"
          # half a second in. --fail now turns that into an immediate curl error,
          # and the GitHub release is the mirror least likely to answer 200 with
          # something that is not an archive.
          curl -sfSL --retry 3 --retry-all-errors -o z.tar.gz \
            "https://github.com/madler/zlib/releases/download/v$ZLIB_VER/zlib-$ZLIB_VER.tar.gz"
          tar xzf z.tar.gz
          cd "zlib-$ZLIB_VER"
          CC="${CROSS}gcc" ./configure --prefix="$STAGE" --static
          make -j"$(nproc)"
          make install
          ls -l "$STAGE/lib"/libz.*

      - name: Build libffi
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o ffi.tar.gz \
            "https://github.com/libffi/libffi/releases/download/v$LIBFFI_VER/libffi-$LIBFFI_VER.tar.gz"
          tar xzf ffi.tar.gz
          cd "libffi-$LIBFFI_VER"
          ./configure --build=x86_64-linux-gnu --host=aarch64-linux-gnu \
            --prefix="$STAGE" --enable-static --disable-shared \
            --disable-multi-os-directory --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          ls -l "$STAGE/lib"/libffi*

      - name: Build pcre2
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o pcre2.tar.gz \
            "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-$PCRE2_VER/pcre2-$PCRE2_VER.tar.gz"
          tar xzf pcre2.tar.gz
          cd "pcre2-$PCRE2_VER"
          ./configure --build=x86_64-linux-gnu --host=aarch64-linux-gnu \
            --prefix="$STAGE" --enable-static --disable-shared \
            --disable-cpp --without-readline --without-zlib --without-bzip2 \
            --disable-dependency-tracking
          make -j"$(nproc)"
          make install
          ls -l "$STAGE/lib"/libpcre2-8.a "$STAGE/lib/pkgconfig/libpcre2-8.pc"

      - name: Build pixman
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o px.tar.xz \
            "https://xorg.freedesktop.org/releases/individual/lib/pixman-$PIXMAN_VER.tar.xz"
          tar xf px.tar.xz
          cd "pixman-$PIXMAN_VER"

          # cpu= was added after this version, and a value of the wrong type is
          # rejected just as hard as an unknown name, so both are corrected
          # against pixman's own declaration rather than against a guess.
          OPTS=$(python3 "$GITHUB_WORKSPACE/tools/meson_opts.py" . \
                   tests=disabled libpng=disabled cpu=base)
          echo "asking for: $OPTS"
          meson setup build --prefix="$STAGE" \
            --cross-file "$RUNNER_TEMP/aarch64.txt" \
            --default-library=static $OPTS
          ninja -C build
          ninja -C build install
          ls -l "$STAGE/lib"/libpixman-1.a

      - name: Build glib
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o glib.tar.xz \
            "https://download.gnome.org/sources/glib/${GLIB_VER%.*}/glib-$GLIB_VER.tar.xz"
          tar xf glib.tar.xz
          cd "glib-$GLIB_VER"

          # pcre2 and libffi have to be external: the release tarball carries
          # wrap files but not the subproject sources, so internal would try to
          # fetch them at build time. nls, libmount, libelf, sysprof, xattr and
          # the documentation are off because each one is either another static
          # library QEMU would have to be handed or another host tool.
          #
          # The list goes through the same filter as pixman's: glib has renamed
          # and retyped options across point releases, and setup fails on the
          # first one it does not recognise.
          OPTS=$(python3 "$GITHUB_WORKSPACE/tools/meson_opts.py" . \
                   tests=disabled nls=disabled libmount=disabled \
                   libelf=disabled sysprof=disabled oss_fuzz=disabled \
                   gtk_doc=disabled man=disabled xattr=disabled \
                   pcre2=external libffi=external iconv=auto)
          echo "asking for: $OPTS"
          meson setup build --prefix="$STAGE" \
            --cross-file "$RUNNER_TEMP/aarch64.txt" \
            --default-library=static $OPTS
          ninja -C build
          ninja -C build install
          ls -l "$STAGE/lib"/libglib-2.0.a "$STAGE/lib"/libgobject-2.0.a

      - name: Close the static link lines
        run: |
          set -euo pipefail
          # A .pc written for a static build keeps what it privately needs in
          # Libs.private, and only pkg-config --static expands that. QEMU asks
          # meson for static dependencies, so normally it does get expanded, but
          # whether a link line is complete is a two-second question here and a
          # six-minute question if it is only discovered while linking QEMU.
          # So the private requirements are folded into the plain Libs line and
          # the result is linked here, before QEMU is configured at all.
          cd "$STAGE/lib/pkgconfig"
          ls
          for pc in *.pc; do
            priv=$(sed -n 's/^Libs\.private:[[:space:]]*//p' "$pc" | tr -d '\n')
            [ -n "$priv" ] || continue
            echo "$pc: Libs.private =$priv"
            sed -i "s|^Libs: .*|& $priv|" "$pc"
          done

          echo "=== what a static link now asks for ==="
          for pkg in glib-2.0 gobject-2.0 gio-2.0 pixman-1; do
            printf '%s:' "$pkg"
            pkg-config --static --libs "$pkg" || echo " NOT FOUND"
          done

          # The probe is a real link of a real main(), against the same
          # archives QEMU is about to use, in the same mode QEMU is about to be
          # linked in. Anything missing shows up here as an undefined reference,
          # with the symbol name, rather than as a failure somewhere inside 4000
          # translation units. It cannot catch the GOT overflow below - that one
          # depends on how many relocations the binary has - but linking without
          # -static here would not even have tried the same code path.
          printf '#include <glib.h>\n#include <gio/gio.h>\nint main(int argc,char**argv){return g_strv_length(argv)==argc;}\n' \
            > "$RUNNER_TEMP/linkprobe.c"
          aarch64-linux-gnu-gcc -static -no-pie -o "$RUNNER_TEMP/linkprobe" \
            "$RUNNER_TEMP/linkprobe.c" \
            $(pkg-config --static --cflags glib-2.0 gio-2.0 pixman-1) \
            $(pkg-config --static --libs glib-2.0 gobject-2.0 gio-2.0 pixman-1) \
            -static-libgcc -L"$STAGE/lib"
          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/linkprobe" | grep -E "Machine|Type"
          echo "probe INTERP entries: $(aarch64-linux-gnu-readelf -l "$RUNNER_TEMP/linkprobe" | grep -c INTERP || true)"
          echo "static link of glib+gio+pixman for aarch64: ok"

      - name: Build QEMU
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o qemu.tar.xz "https://download.qemu.org/qemu-$QEMU_VER.tar.xz"
          tar xf qemu.tar.xz
          cd "qemu-$QEMU_VER"

          # Arrays rather than strings: --extra-ldflags carries several
          # space-separated values, and a string expanded unquoted would hand
          # configure them as separate arguments.
          #
          # --host-cc has to be named explicitly. Without it QEMU assumes the
          # compiler it was given can also build the tools it runs during the
          # build, and an aarch64 cross compiler cannot produce something the
          # runner is able to execute.
          #
          # Nothing is disabled by name. The --disable-gtk family and
          # --extra-libs are gone from this configure, having moved to meson
          # feature options -- the previous attempt in this file learned that the
          # hard way -- and a cross build does not find them regardless:
          # --cross-prefix makes QEMU write a meson cross file whose pkg-config
          # is aarch64-linux-gnu-pkg-config, so only the aarch64 sysroot and
          # $STAGE are searched, and gtk, sdl, vnc, numa and curl are not in
          # either. The wrapper has to exist for the query to happen at all:
          # without it the glib lookup fails with "Pkg-config for machine host
          # machine not found", which is a missing tool, not a missing library.
          #
          # What is left in --extra-ldflags is only the search path and
          # -static-libgcc. Two things that used to be here are not:
          #
          # "-static": QEMU's --static turns into -Dprefer_static=true, and its
          # meson.build then appends -static-pie or -static itself, having first
          # probed whether the toolchain can do static-pie. Saying it twice puts
          # -static next to -static-pie and buys nothing.
          #
          # the "-lpcre2-8 -lffi -lz" list: configure copies --extra-ldflags
          # verbatim into the cross file it generates, as c_link_args, and meson
          # puts those in front of the libraries rather than behind them. An
          # archive only contributes objects for symbols undefined at the point
          # it appears on the command line, so a -lpcre2-8 ahead of
          # libglib-2.0.a resolves nothing. The transitive libraries have to come
          # from pkg-config, and the step before this one proves that they do.
          # (Without a path in front of them the same list was worse than
          # useless: meson's find_library probes link with these very flags, so
          # an unresolvable -lpcre2-8 is how "Library m found: NO" got in.)
          # --disable-pie is not cosmetic. With --static and PIE left on, QEMU's
          # own probe compiles a three-line main() with -static-pie, that fits,
          # and meson.build then puts -static-pie on the real link too - where it
          # dies at the last of 2929 targets:
          #
          #   libc.a(abort.o): relocation truncated to fit:
          #     R_AARCH64_LD64_GOTPAGE_LO15 against symbol '__stack_chk_guard'
          #   too many GOT entries for -fpic, please recompile with -fPIC
          #
          # A static-pie binary resolves everything through the GOT, the GOT on
          # aarch64 is 16-bit-offset-limited, and the aarch64 glibc static archive
          # in this sysroot is not compiled with -fPIC, so QEMU's few thousand
          # relocations simply do not fit. Saying --disable-pie makes meson use
          # plain -static instead, and also adds -fno-pie -no-pie to every compile.
          base=(--cross-prefix="$CROSS" --host-cc=gcc --static --disable-pie
                --python=python3 --prefix=/usr --target-list=aarch64-softmmu
                --extra-ldflags="-L$STAGE/lib -static-libgcc")

          # What configure does accept stays in the log, so the next version
          # bump has something to check against instead of a guess.
          echo "=== configure --help ==="
          ./configure --help | sed -n '1,160p'

          echo "configuring with: ${base[*]}"
          ./configure "${base[@]}"
          make -j"$(nproc)"

          echo "=== what came out ==="
          file build/qemu-system-aarch64
          aarch64-linux-gnu-readelf -d build/qemu-system-aarch64 | head -5 || true
          ls -l build/qemu-system-aarch64 build/qemu-img

          # TCG is the point of this bundle. KVM compiled in would not break it,
          # since the run script asks for tcg explicitly, but it should be
          # visible which one the build ended up with.
          grep -E "CONFIG_TCG|CONFIG_KVM" build/config-host.mak || true

      - name: Build busybox for the guest
        run: |
          set -euo pipefail
          curl -sfSL --retry 3 --retry-all-errors -o bb.tar.bz2 "https://busybox.net/downloads/busybox-$BUSYBOX_VER.tar.bz2"
          tar xjf bb.tar.bz2
          cd "busybox-$BUSYBOX_VER"
          make defconfig
          # Same reason as the firmware-side ramdisk, and the same three applets
          # are not in defconfig. The guest calls date, awk, grep and dd; all in
          # defconfig already.
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/^# CONFIG_INSTALL_APPLET is not set/CONFIG_INSTALL_APPLET=y/' .config
          make CROSS_COMPILE="$CROSS" -j"$(nproc)"
          file busybox

      - name: Fetch a guest kernel
        env:
          K: ${{ runner.temp }}/guest/vmlinuz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guest"
          curl -sfSL --retry 3 --retry-all-errors -o "$K" \
            "https://dl-cdn.alpinelinux.org/alpine/$ALPINE/releases/aarch64/netboot/vmlinuz-virt"
          ls -l "$K"

          # Alpine's aarch64 netboot kernel is not an arm64 Image and not a gzip
          # stream: it is an EFI zboot container, "MZ" at 0x00, "zimg" at 0x04 and
          # the linux magic cd238281 at 0x38, with a gzip payload inside. QEMU 8.2
          # unpacks that by itself, but a bundle whose kernel only loads under a
          # recent enough QEMU is a worse deal than a file converted once here, so
          # tools/zboot_unpack.py turns it into a plain Image and refuses to
          # write anything that does not carry ARM\x64 at 0x38.
          python3 tools/zboot_unpack.py "$K" -o "$K"
          ls -l "$K"

      - name: Assemble the guest initramfs
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/guestroot"
          rm -rf "$ROOT"; mkdir -p "$ROOT/bin"
          install -m 0755 "busybox-$BUSYBOX_VER/busybox" "$ROOT/bin/busybox"
          ln -s busybox "$ROOT/bin/sh"
          install -m 0755 linux-prep/guest-init "$ROOT/init"
          python3 tools/mk_initramfs.py "$ROOT" -o "$RUNNER_TEMP/guest/initrd-smoke.cpio.gz"
          gzip -t "$RUNNER_TEMP/guest/initrd-smoke.cpio.gz"
          ls -l "$RUNNER_TEMP/guest"

      - name: Boot the guest on the runner
        run: |
          # Explicit, and load-bearing: the runner wraps every run: block in
          # "bash -e", and "set -uo pipefail" does not switch that off. The first
          # version of this step therefore died at the qemu line, before the cat
          # that prints the guest's console, and the log ended with apt's summary
          # and an exit code of 1 - the one thing this step exists to show was the
          # one thing not printed.
          set +e
          set -o pipefail
          # The arm64 QEMU in this bundle cannot be exercised here as an emulator
          # - it is an arm64 binary, and running a system emulator under user-mode
          # emulation is far too slow to be a test - but the guest it is meant to
          # start can be: apt's qemu-system-aarch64 runs natively on the x86
          # runner and emulates arm64 with the same TCG. So this boots the kernel
          # and initramfs exactly as assembled, with the same -kernel/-initrd/
          # -append the run script uses, and looks for the marker guest-init
          # prints before it powers off. Without it the phone session would be the
          # first time anything here is ever started.
          #
          # Not proof of the shipped binary - the next step runs that - and 6.2
          # rather than 8.2.2, against a kernel already normalised to a plain
          # Image so that the version cannot be the reason anything fails here.
          # A failure therefore warns instead of stopping the job: the emulator
          # and the guest are published either way, and the console log below is
          # the thing worth having.
          sudo apt-get install -y --no-install-recommends qemu-system-arm
          QT=$(command -v qemu-system-aarch64)
          echo "test emulator: $($QT --version 2>&1 | head -1)"
          LOG="$RUNNER_TEMP/boot.log"
          # The flag set is run.sh's, minus thread=multi which is about the phone's
          # cores and thermals: -nic none included, because the first version of
          # this step got "qemu-system-aarch64: failed to find romfile
          # efi-virtio.rom" and exit 1 with an empty console. With no -net given,
          # QEMU creates its default NIC anyway, and that device wants an EFI
          # option ROM from the emulator's datadir - which the phone has no more
          # of than the runner does. Discovering that here cost one CI run; on the
          # device it would have cost the session.
          timeout 900 "$QT" \
            -machine virt -cpu max -accel tcg -nic none -smp 2 -m 1024 \
            -kernel "$RUNNER_TEMP/guest/vmlinuz" \
            -initrd "$RUNNER_TEMP/guest/initrd-smoke.cpio.gz" \
            -append "console=ttyAMA0 rdinit=/init" \
            -nographic -no-reboot > "$LOG" 2>&1
          rc=$?
          echo ""
          echo "=== guest console, exit $rc from timeout 900 ==="
          cat "$LOG"
          echo "=== end of guest console ==="
          echo ""
          if grep -q "QEMU-SMOKE-OK" "$LOG"; then
              echo "guest boot: PASS (emulator exit $rc)"
          else
              echo "guest boot: NOT PROVEN - no marker in the console log, exit $rc"
              echo "::warning::the guest did not print QEMU-SMOKE-OK on the runner"
          fi

      - name: Prove the binaries actually run
        run: |
          set -euo pipefail
          # A static arm64 ELF needs nothing but the syscall ABI, so qemu-user on
          # the runner can execute it. This is the only check available before the
          # phone, and it catches a bad link that --version would not show as a
          # crash: missing shared libraries cannot be a missing shared library.
          qemu-aarch64-static "qemu-$QEMU_VER/build/qemu-system-aarch64" --version
          qemu-aarch64-static "qemu-$QEMU_VER/build/qemu-img" --version
          qemu-aarch64-static "busybox-$BUSYBOX_VER/busybox" true
          echo "all three execute as aarch64"

          # No PT_DYNAMIC means no loader, no interpreter, nothing to be missing
          # on the device.
          for f in "qemu-$QEMU_VER/build/qemu-system-aarch64" "busybox-$BUSYBOX_VER/busybox"; do
            if aarch64-linux-gnu-readelf -l "$f" | grep -q "INTERP"; then
              echo "FAIL: $f is dynamically linked"; exit 1
            fi
          done
          echo "no interpreter: both are static"

      - name: Pack the bundle
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundle"
          rm -rf "$B"; mkdir -p "$B"/{bin,guest}
          install -m 0755 "qemu-$QEMU_VER/build/qemu-system-aarch64" "$B/bin/"
          install -m 0755 "qemu-$QEMU_VER/build/qemu-img"            "$B/bin/"
          install -m 0755 "busybox-$BUSYBOX_VER/busybox"             "$B/bin/"
          cp "$RUNNER_TEMP/guest/vmlinuz"                  "$B/guest/"
          cp "$RUNNER_TEMP/guest/initrd-smoke.cpio.gz"     "$B/guest/"
          install -m 0755 linux-prep/qemu-run.sh           "$B/run.sh"
          mkdir -p dist/qemu
          tar --owner=0 --group=0 --numeric-owner -czf dist/qemu/courbet-qemu.tar.gz -C "$B" .
          ( cd dist/qemu && sha256sum courbet-qemu.tar.gz > SHA256SUMS && cat SHA256SUMS )
          ls -l dist/qemu
          du -h "$B"/bin/* "$B"/guest/*

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/qemu
          git commit -m "Publish QEMU TCG bundle [skip ci]" || echo "unchanged"
          # The firmware and ramdisk workflows push to the same branch and can
          # land first, so rebase rather than assume this is the only writer.
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: courbet-qemu
          path: dist/qemu/courbet-qemu.tar.gz
          if-no-files-found: error

      - name: What to do with it
        run: |
          echo 'On the phone, from a root shell in recovery:'
          echo '  cd /data && mkdir -p qemu'
          echo '  adb push dist/qemu/courbet-qemu.tar.gz /tmp/'
          echo '  tar xzf /tmp/courbet-qemu.tar.gz -C /data/qemu'
          echo '  sh /data/qemu/run.sh'
