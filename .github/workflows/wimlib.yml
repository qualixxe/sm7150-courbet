name: wimlib (static aarch64)

# Unpacking install.wim into the NTFS volume on the phone has to happen
# natively: Windows Setup doing the same job under emulation was measured at
# ~16 KB/s of disk growth, which is days for a 20 GB Windows tree. wimlib does
# it as a plain aarch64 binary at disk speed, so it is cross-built here as a
# single self-contained file and committed next to the images.
#
# Static musl on purpose: the phone runs Android's bionic, not glibc, and a
# dynamically linked Linux binary would find no loader there. gcc-aarch64 with
# LDFLAGS=-static still produced a PIE binary against the cross glibc, so the
# toolchain is musl instead, where a static link is the normal case.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wimlib.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config
          curl -fsSL -o musl.tgz https://musl.cc/aarch64-linux-musl-cross.tgz \
            || curl -fsSL -o musl.tgz https://more.musl.cc/11.2.1/x86_64-linux-musl/aarch64-linux-musl-cross.tgz
          tar xf musl.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"
          "$PWD/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc" --version | head -1

      - name: Source
        run: |
          curl -fsSL -o wimlib.tar.gz \
            https://github.com/ebiggers/wimlib/archive/refs/tags/v1.14.4.tar.gz
          tar xf wimlib.tar.gz
          ls wimlib-1.14.4 | head

      - name: Build
        run: |
          set -euo pipefail
          cd wimlib-1.14.4
          ./bootstrap
          ./configure --host=aarch64-linux-musl \
            --disable-shared --enable-static \
            --without-ntfs-3g --without-fuse --disable-nls \
            CC=aarch64-linux-musl-gcc LDFLAGS="-static" \
            CFLAGS="-O2 -fno-pie" 
          make -j"$(nproc)" LDFLAGS="-static"
          # the build is non-recursive, so the linked binary lands in the top dir
          BIN=$(find . -maxdepth 1 -name 'wimlib-imagex' -type f)
          file "$BIN"
          file "$BIN" | grep -q 'statically linked'
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Publish
        run: |
          set -euo pipefail
          mkdir -p dist/tools
          cp "$BIN" dist/tools/wimlib-imagex-aarch64
          chmod +x dist/tools/wimlib-imagex-aarch64
          ls -l dist/tools
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/tools
          git commit -m "Publish static wimlib-imagex (aarch64) [skip ci]" || echo "binary unchanged"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
